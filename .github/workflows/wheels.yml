name: Build wheels

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  # Opt into Node.js 24 for all actions to avoid Node.js 20 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        # v2.22.0 ships updated manylinux/musllinux image digests, fixing the
        # broken quay.io/pypa/manylinux2014_x86_64:2024.07.02-0 tag used by v2.19.2.
        uses: pypa/cibuildwheel@v2.22.0
        env:
          # Keep the matrix explicit and predictable.
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_TEST_COMMAND: >-
            python -c "import genetic_algorithm_lib as ga; s = ga.SearchConfig(); s.population_size = 6; s.iterations = 2; s.dimension = 2; s.seed = 1; c = ga.PsoConfig(); c.search = s; r = ga.ParticleSwarmOptimizer(c).optimize(lambda x: 1.0 / (1.0 + sum(v * v for v in x))); assert len(r.best_solution) == 2"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
